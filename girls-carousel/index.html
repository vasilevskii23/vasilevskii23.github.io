<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Карусель · Плёнка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #ebe4d6;
  --ink: #1a1714;
  --film: #111111;
  --sprocket: #f4efe6;
  --accent: #e8b84a;
  --peach: #e8a87c;
  --soft: #f7f1e6;
  --shadow: rgba(40, 28, 16, 0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Special Elite", "Courier New", monospace;
  background:
    radial-gradient(120% 80% at 50% 0%, #2a241c 0%, #14110e 55%, #0c0a08 100%);
  color: var(--ink);
  display: grid;
  place-items: center;
  min-height: 100dvh;
  padding: 18px 12px 28px;
}

.app {
  width: min(420px, 100%);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.brand {
  text-align: center;
  color: #e8dfd0;
  letter-spacing: 0.08em;
}
.brand h1 {
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400;
  font-size: clamp(1.7rem, 6vw, 2.1rem);
  letter-spacing: 0.02em;
}
.brand p {
  margin-top: 4px;
  font-size: 0.72rem;
  opacity: 0.65;
  text-transform: uppercase;
}

.phone {
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  background: var(--paper) url("assets/paper.jpg") center/cover;
  box-shadow:
    0 30px 60px rgba(0,0,0,0.45),
    0 0 0 1px rgba(255,255,255,0.06) inset;
  aspect-ratio: 9 / 16;
}

.carousel {
  position: absolute;
  inset: 0;
  display: flex;
  transition: transform 0.55s cubic-bezier(0.22, 0.9, 0.28, 1);
  will-change: transform;
  touch-action: pan-y;
}

.slide {
  position: relative;
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  padding: 8% 6%;
  overflow: hidden;
}

/* ---------- shared film strip ---------- */
.film {
  position: relative;
  background: var(--film);
  border-radius: 4px;
  padding: 14px 10px;
  box-shadow: 0 10px 24px var(--shadow);
}
.film::before,
.film::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  height: 8px;
  background:
    repeating-linear-gradient(
      90deg,
      var(--sprocket) 0 10px,
      transparent 10px 18px
    );
  opacity: 0.95;
}
.film::before { top: 4px; }
.film::after { bottom: 4px; }

.frame {
  margin: 10px 6px;
  aspect-ratio: 1;
  overflow: hidden;
  background: #222;
  border: 2px solid #0a0a0a;
}
.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: contrast(1.05) saturate(1.05);
}

.frames-row {
  display: flex;
  gap: 8px;
}
.frames-row .frame {
  flex: 1;
  margin: 10px 2px;
}

/* ---------- slide 1: canister ---------- */
.slide-1 .stack {
  position: absolute;
  left: 4%;
  right: 4%;
  top: 42%;
  transform: translateY(-50%) rotate(-2deg);
  display: grid;
  grid-template-columns: 0.9fr 1.25fr;
  gap: 0;
  align-items: center;
}

.canister {
  position: relative;
  width: 100%;
  aspect-ratio: 0.85;
  filter: drop-shadow(0 8px 14px rgba(0,0,0,0.25));
}
.canister svg { width: 100%; height: 100%; display: block; }

.slide-1 .film {
  transform: translateX(-6px) rotate(1.5deg);
  z-index: 1;
}

.clip-note {
  position: absolute;
  top: 7%;
  right: 7%;
  width: 28%;
  transform: rotate(8deg);
  z-index: 3;
}
.note {
  background: #f3ead8;
  border: 2px solid #c0392b;
  padding: 14px 8px 12px;
  font-size: 0.62rem;
  line-height: 1.25;
  box-shadow: 0 6px 14px var(--shadow);
  text-align: center;
}
.note strong {
  display: block;
  font-family: "Caveat", cursive;
  font-size: 1.15rem;
  font-weight: 700;
  margin-top: 4px;
}
.binder {
  width: 42%;
  margin: 0 auto -8px;
  display: block;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
}

/* ---------- slide 2: postcard ---------- */
.slide-2 .film-wrap {
  position: absolute;
  left: -8%;
  right: -8%;
  top: 38%;
  transform: translateY(-50%) rotate(-1deg);
}
.postcard {
  position: absolute;
  top: 12%;
  right: 6%;
  width: 46%;
  transform: rotate(14deg);
  z-index: 4;
}
.envelope {
  position: absolute;
  inset: 10% -8% -8% 8%;
  background: #9ec4e8;
  border-radius: 2px;
  box-shadow: 0 8px 18px var(--shadow);
  z-index: -1;
}
.card {
  position: relative;
  background: #f7f0e4;
  border: 1px solid #d8cdb8;
  padding: 12px 10px 14px;
  box-shadow: 0 10px 20px var(--shadow);
  min-height: 110px;
}
.card .pc {
  font-size: 0.55rem;
  letter-spacing: 0.18em;
  opacity: 0.55;
}
.card .stamp {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 34px;
  border: 1.5px dashed #8a7a66;
}
.card .love {
  margin-top: 18px;
  font-family: "Caveat", cursive;
  font-size: 1.35rem;
  color: #2f5f9a;
  line-height: 1.05;
}
.croissant {
  position: absolute;
  left: 2%;
  bottom: 16%;
  width: 32%;
  transform: rotate(-22deg);
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25));
  z-index: 5;
}

/* ---------- slide 3: charms + coffee ---------- */
.slide-3 .film-wrap {
  position: absolute;
  left: -10%;
  right: -4%;
  top: 40%;
  transform: translateY(-50%) rotate(1deg);
}
.ticket {
  position: absolute;
  top: 9%;
  left: 6%;
  width: 18%;
  background: #f4ecdc;
  border: 1px solid #c9b89a;
  padding: 10px 4px;
  font-size: 0.5rem;
  text-align: center;
  letter-spacing: 0.04em;
  transform: rotate(-8deg);
  box-shadow: 0 6px 12px var(--shadow);
  z-index: 4;
}
.ticket b {
  display: block;
  font-size: 0.72rem;
  margin-top: 6px;
  letter-spacing: 0.08em;
}
.charms {
  position: absolute;
  left: 3%;
  top: 28%;
  width: 22%;
  z-index: 5;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
  transform: rotate(-6deg);
}
.receipt-stack {
  position: absolute;
  right: 4%;
  bottom: 14%;
  width: 42%;
  z-index: 5;
}
.receipt {
  background: #faf7f0;
  padding: 10px 8px 12px;
  font-size: 0.42rem;
  line-height: 1.35;
  box-shadow: 0 8px 16px var(--shadow);
  transform: rotate(4deg);
}
.receipt h4 {
  font-size: 0.52rem;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 0.04em;
}
.receipt .line {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  border-bottom: 1px dotted #bbb;
  padding: 2px 0;
}
.receipt .bar {
  margin-top: 6px;
  height: 18px;
  background:
    repeating-linear-gradient(90deg, #222 0 2px, transparent 2px 4px);
  opacity: 0.75;
}
.coffee {
  position: absolute;
  right: -2%;
  bottom: -22%;
  width: 72%;
  transform: rotate(-6deg);
  filter: drop-shadow(0 8px 14px rgba(0,0,0,0.28));
}

/* ---------- chrome ---------- */
.dots {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 7%;
  display: flex;
  justify-content: center;
  gap: 8px;
  z-index: 10;
}
.dots span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(40, 30, 20, 0.25);
  transition: transform 0.25s, background 0.25s;
  cursor: pointer;
  pointer-events: auto;
}
.dots span.on {
  background: rgba(40, 30, 20, 0.75);
  transform: scale(1.15);
}

.controls {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.controls button {
  appearance: none;
  border: 0;
  cursor: pointer;
  background: linear-gradient(180deg, #f0c29a, #e39a6a);
  color: #2a1c12;
  font-family: "Special Elite", monospace;
  font-size: 0.85rem;
  padding: 14px 22px;
  border-radius: 999px;
  box-shadow: 0 10px 22px rgba(0,0,0,0.28);
  min-width: 140px;
  transition: transform 0.15s, filter 0.15s;
}
.controls button:active { transform: scale(0.97); }
.controls button.ghost {
  background: rgba(255,255,255,0.08);
  color: #e8dfd0;
  box-shadow: none;
  border: 1px solid rgba(255,255,255,0.12);
  min-width: 0;
  padding-inline: 18px;
}

.hint {
  text-align: center;
  color: rgba(232, 223, 208, 0.45);
  font-size: 0.68rem;
}

@media (prefers-reduced-motion: reduce) {
  .carousel { transition: none; }
}
</style>
</head>
<body>
  <div class="app">
    <header class="brand">
      <h1>Карусель девочек</h1>
      <p>плёночный scrapbook · по референсу</p>
    </header>

    <div class="phone" id="phone" aria-roledescription="carousel" aria-label="Фотокарусель">
      <div class="carousel" id="carousel">
        <!-- SLIDE 1 -->
        <section class="slide slide-1" aria-label="Слайд 1 из 3">
          <div class="clip-note">
            <svg class="binder" viewBox="0 0 60 40" aria-hidden="true">
              <rect x="18" y="2" width="24" height="14" rx="3" fill="#c8ccd1" stroke="#8a9098"/>
              <rect x="22" y="14" width="16" height="22" rx="2" fill="#dfe3e8" stroke="#8a9098"/>
              <rect x="26" y="18" width="8" height="10" rx="1" fill="#b8bec6"/>
            </svg>
            <div class="note">
              good things<br/>are coming
              <strong>10.10.2026</strong>
            </div>
          </div>

          <div class="stack">
            <div class="canister" aria-hidden="true">
              <svg viewBox="0 0 200 240" fill="none">
                <ellipse cx="100" cy="28" rx="70" ry="18" fill="#1a1a1a"/>
                <path d="M30 28 V175 C30 200 170 200 170 175 V28" fill="#222" stroke="#0d0d0d" stroke-width="3"/>
                <ellipse cx="100" cy="175" rx="70" ry="20" fill="#111"/>
                <rect x="48" y="55" width="104" height="110" rx="4" fill="#f0c44a" stroke="#1a1a1a" stroke-width="3"/>
                <text x="100" y="82" text-anchor="middle" fill="#1a1a1a" font-family="Special Elite, monospace" font-size="11">35 mm Film</text>
                <text x="100" y="108" text-anchor="middle" fill="#1a1a1a" font-family="Caveat, cursive" font-size="22" font-weight="700">girls reel</text>
                <text x="100" y="132" text-anchor="middle" fill="#1a1a1a" font-family="Special Elite, monospace" font-size="28" font-weight="700">400</text>
                <text x="100" y="150" text-anchor="middle" fill="#1a1a1a" font-family="Special Elite, monospace" font-size="10">PRO CCD · 36 EXP</text>
                <ellipse cx="100" cy="28" rx="28" ry="8" fill="#333"/>
              </svg>
            </div>
            <div class="film">
              <div class="frame">
                <img src="assets/girl1_sq.jpg" alt="Девочка на фоне Minecraft-инсталляции" />
              </div>
            </div>
          </div>
        </section>

        <!-- SLIDE 2 -->
        <section class="slide slide-2" aria-label="Слайд 2 из 3">
          <div class="postcard">
            <div class="envelope"></div>
            <div class="card">
              <div class="pc">POST CARD</div>
              <div class="stamp"></div>
              <div class="love">from adventure<br/>with love</div>
            </div>
          </div>

          <div class="film-wrap">
            <div class="film">
              <div class="frames-row">
                <div class="frame">
                  <img src="assets/girl2_sq.jpg" alt="Девочка в жёлтой толстовке у статуи" />
                </div>
                <div class="frame">
                  <img src="assets/girl1_sq.jpg" alt="Кадр из той же серии" />
                </div>
              </div>
            </div>
          </div>

          <svg class="croissant" viewBox="0 0 140 100" aria-hidden="true">
            <defs>
              <linearGradient id="cr" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f6d08a"/>
                <stop offset="55%" stop-color="#e09a3d"/>
                <stop offset="100%" stop-color="#b86a1e"/>
              </linearGradient>
            </defs>
            <path d="M18 62 C28 28 58 12 88 18 C112 24 128 42 122 58 C108 48 78 42 52 48 C38 52 26 58 18 62Z" fill="url(#cr)" stroke="#8a4e14" stroke-width="2"/>
            <path d="M34 54 C52 34 84 28 108 40" stroke="#fff0c8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
            <path d="M40 60 C60 44 86 40 108 50" stroke="#c47822" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="96" cy="36" rx="8" ry="5" fill="#f8e0a8" opacity="0.55" transform="rotate(-20 96 36)"/>
          </svg>
        </section>

        <!-- SLIDE 3 -->
        <section class="slide slide-3" aria-label="Слайд 3 из 3">
          <div class="ticket">
            MEMORIES
            <b>10102026</b>
            KEEP
          </div>

          <svg class="charms" viewBox="0 0 80 140" aria-hidden="true">
            <path d="M40 0 V55" stroke="#b8bcc2" stroke-width="3"/>
            <circle cx="40" cy="8" r="5" fill="#d0d4d8" stroke="#8a9098"/>
            <path d="M28 55 Q40 70 52 55 Q40 48 28 55Z" fill="#cfd3d8" stroke="#8a9098"/>
            <text x="40" y="62" text-anchor="middle" font-size="5" fill="#555" font-family="Special Elite, monospace">HEART</text>
            <path d="M40 70 V100" stroke="#b8bcc2" stroke-width="3"/>
            <polygon points="40,95 48,110 40,125 32,110" fill="#cfd3d8" stroke="#8a9098"/>
          </svg>

          <div class="film-wrap">
            <div class="film">
              <div class="frames-row">
                <div class="frame">
                  <img src="assets/girl3_sq.jpg" alt="Девочка и друг у сказочной инсталляции" />
                </div>
                <div class="frame">
                  <img src="assets/girl2_sq.jpg" alt="Кадр с удивлённым выражением" />
                </div>
              </div>
            </div>
          </div>

          <div class="receipt-stack">
            <div class="receipt">
              <h4>THANK YOU FOR<br/>THE MEMORIES</h4>
              <div class="line"><span>MINECRAFT DAY</span><span>01</span></div>
              <div class="line"><span>NORTHMAN QUEST</span><span>01</span></div>
              <div class="line"><span>FAIRYTALE WALK</span><span>01</span></div>
              <div class="line"><span>TOTAL SMILES</span><span>∞</span></div>
              <div class="bar"></div>
            </div>
            <svg class="coffee" viewBox="0 0 160 150" aria-hidden="true">
              <defs>
                <radialGradient id="latte" cx="45%" cy="40%" r="60%">
                  <stop offset="0%" stop-color="#d9b48a"/>
                  <stop offset="55%" stop-color="#8a5a32"/>
                  <stop offset="100%" stop-color="#4a2a16"/>
                </radialGradient>
                <linearGradient id="cr2" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#f0c57a"/>
                  <stop offset="100%" stop-color="#c47a28"/>
                </linearGradient>
              </defs>
              <ellipse cx="70" cy="70" rx="52" ry="52" fill="#f7f4ee" stroke="#d2ccc0" stroke-width="4"/>
              <circle cx="70" cy="70" r="40" fill="url(#latte)"/>
              <path d="M58 62 C64 54 70 68 76 58 C82 68 88 56 86 74 C78 86 62 82 58 62Z" fill="#f3e2c4" opacity="0.9"/>
              <path d="M118 52 C138 52 140 90 118 90" stroke="#d2ccc0" stroke-width="7" fill="none" stroke-linecap="round"/>
              <path d="M108 118 C128 108 152 122 138 138 C120 148 98 134 108 118Z" fill="url(#cr2)" stroke="#8a4e14" stroke-width="1.5"/>
              <path d="M116 124 C128 118 140 126 134 134" stroke="#fff0c8" stroke-width="2" fill="none" opacity="0.7"/>
            </svg>
          </div>
        </section>
      </div>

      <div class="dots" id="dots" aria-hidden="true">
        <span class="on"></span><span></span><span></span>
      </div>
    </div>

    <div class="controls">
      <button class="ghost" type="button" id="prev" aria-label="Предыдущий слайд">←</button>
      <button type="button" id="next">Дальше →</button>
    </div>
    <p class="hint">свайпните по кадру · 3 слайда</p>
  </div>

<script>
(() => {
  const carousel = document.getElementById("carousel");
  const dots = [...document.getElementById("dots").children];
  const phone = document.getElementById("phone");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  let index = 0;
  const total = 3;

  const go = (i) => {
    index = ((i % total) + total) % total;
    carousel.style.transition = "transform 0.55s cubic-bezier(0.22, 0.9, 0.28, 1)";
    carousel.style.transform = `translate3d(-${index * 100}%, 0, 0)`;
    dots.forEach((d, n) => {
      d.classList.toggle("on", n === index);
      d.setAttribute("aria-current", n === index ? "true" : "false");
    });
  };

  prevBtn.addEventListener("click", (e) => { e.preventDefault(); go(index - 1); });
  nextBtn.addEventListener("click", (e) => { e.preventDefault(); go(index + 1); });
  dots.forEach((d, n) => {
    d.style.pointerEvents = "auto";
    d.style.cursor = "pointer";
    d.addEventListener("click", () => go(n));
  });

  let startX = 0, delta = 0, dragging = false, activePointer = null;
  const onStart = (x, id) => {
    dragging = true;
    activePointer = id;
    startX = x;
    delta = 0;
    carousel.style.transition = "none";
  };
  const onMove = (x) => {
    if (!dragging) return;
    delta = x - startX;
    const pct = (delta / phone.clientWidth) * 100;
    carousel.style.transform = `translate3d(calc(-${index * 100}% + ${pct}%), 0, 0)`;
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    activePointer = null;
    if (Math.abs(delta) > phone.clientWidth * 0.16) go(index + (delta < 0 ? 1 : -1));
    else go(index);
  };

  phone.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    phone.setPointerCapture(e.pointerId);
    onStart(e.clientX, e.pointerId);
  });
  phone.addEventListener("pointermove", (e) => {
    if (activePointer !== e.pointerId) return;
    onMove(e.clientX);
  });
  phone.addEventListener("pointerup", (e) => {
    if (activePointer !== e.pointerId) return;
    onEnd();
  });
  phone.addEventListener("pointercancel", onEnd);

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(index + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(index - 1); }
  });

  go(0);
})();
</script>
</body>
</html>
