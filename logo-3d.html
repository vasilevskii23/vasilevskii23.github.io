<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALTER EGO — 3D Liquid Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #101018;
      --mute: rgba(16, 16, 24, 0.62);
      --glass: rgba(255, 255, 255, 0.22);
      --stroke: rgba(255, 255, 255, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background: #0b1020;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 48px 20px 72px;
      isolation: isolate;
    }

    .aurora {
      position: absolute;
      inset: -20%;
      z-index: -2;
      background:
        radial-gradient(ellipse 50% 45% at 18% 28%, #5b8cff 0%, transparent 55%),
        radial-gradient(ellipse 45% 40% at 82% 22%, #ff6b9d 0%, transparent 50%),
        radial-gradient(ellipse 55% 50% at 55% 78%, #36d6c3 0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 30% 70%, #ffb347 0%, transparent 50%),
        linear-gradient(145deg, #1a2450, #2a1540 45%, #0f2a38);
      animation: drift 18s ease-in-out infinite alternate;
      filter: saturate(1.15);
    }

    .noise {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.08;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    @keyframes drift {
      0% { transform: translate3d(-2%, -1%, 0) scale(1.05); }
      100% { transform: translate3d(2%, 2%, 0) scale(1.12); }
    }

    .frame {
      width: min(920px, 100%);
      display: grid;
      gap: 28px;
      justify-items: center;
      text-align: center;
    }

    .brand {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: 0.08em;
      color: #fff;
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      animation: rise 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .sub {
      max-width: 36ch;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
      line-height: 1.5;
      margin-top: -12px;
      animation: rise 900ms 80ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .logo-wrap {
      position: relative;
      width: min(520px, 86vw);
      aspect-ratio: 1;
      animation: float 6.5s ease-in-out infinite, rise 1000ms 140ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      transform-style: preserve-3d;
      perspective: 900px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 28px 50px rgba(8, 12, 40, 0.45));
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .logo-wrap:hover img {
      transform: rotateX(8deg) rotateY(-10deg) scale(1.03);
    }

    .glass-ring {
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.28), transparent 42%);
      mix-blend-mode: screen;
      opacity: 0.85;
      animation: sheen 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @keyframes sheen {
      0%, 100% { opacity: 0.55; transform: translate(-2%, -1%); }
      50% { opacity: 0.95; transform: translate(2%, 2%); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      animation: rise 900ms 220ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--stroke);
      background: var(--glass);
      color: #fff;
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border-radius: 14px;
      padding: 12px 18px;
      font: 500 14px/1 "IBM Plex Sans", system-ui, sans-serif;
      text-decoration: none;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.34);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: min(640px, 100%);
      animation: rise 900ms 280ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .chip {
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 14px 12px;
      color: rgba(255,255,255,0.9);
    }

    .chip strong {
      display: block;
      font-family: Syne, sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .chip span {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      line-height: 1.35;
    }

    .compare {
      width: min(640px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
      animation: rise 900ms 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .compare figure {
      margin: 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
    }

    .compare img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      display: block;
      background:
        linear-gradient(45deg, rgba(255,255,255,0.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.08) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    .compare figcaption {
      padding: 10px 12px 12px;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      text-align: left;
    }

    @media (max-width: 640px) {
      .meta { grid-template-columns: 1fr; }
      .compare { grid-template-columns: 1fr; }
      .stage { padding: 36px 16px 56px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="aurora" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>

    <div class="frame">
      <h1 class="brand">ALTER EGO</h1>
      <p class="sub">3D-логотип с эффектом жидкого стекла в духе новой iOS. PNG с прозрачным фоном.</p>

      <div class="logo-wrap" id="logoTilt">
        <span class="glass-ring" aria-hidden="true"></span>
        <img
          src="assets/alter-ego-logo-3d-glass.png"
          alt="ALTER EGO — 3D liquid glass logo"
          width="1024"
          height="1024"
        />
      </div>

      <div class="actions">
        <a class="btn" href="assets/alter-ego-logo-3d-glass.png" download>Скачать PNG</a>
        <a class="btn" href="assets/alter-ego-logo-3d-glass-solid.png" download>Плотная версия</a>
        <a class="btn" href="assets/alter-ego-logo-original.jpg" download>Оригинал</a>
      </div>

      <div class="meta">
        <div class="chip">
          <strong>Материал</strong>
          <span>Frosted liquid glass, bevel и specular rim light</span>
        </div>
        <div class="chip">
          <strong>Фон</strong>
          <span>Прозрачный alpha-канал, готов для наложений</span>
        </div>
        <div class="chip">
          <strong>Формат</strong>
          <span>1024×1024 PNG</span>
        </div>
      </div>

      <div class="compare">
        <figure>
          <img src="assets/alter-ego-logo-original.jpg" alt="Оригинальный штамп ALTER EGO" />
          <figcaption>Исходный 2D-штамп</figcaption>
        </figure>
        <figure>
          <img src="assets/alter-ego-logo-3d-glass.png" alt="3D glass версия ALTER EGO" />
          <figcaption>3D liquid glass</figcaption>
        </figure>
      </div>
    </div>
  </main>

  <script>
    const wrap = document.getElementById("logoTilt");
    const img = wrap.querySelector("img");
    let raf = 0;
    let targetX = 0;
    let targetY = 0;
    let curX = 0;
    let curY = 0;

    function tick() {
      curX += (targetX - curX) * 0.12;
      curY += (targetY - curY) * 0.12;
      img.style.transform = `rotateX(${curY}deg) rotateY(${curX}deg)`;
      raf = requestAnimationFrame(tick);
    }

    wrap.addEventListener("pointermove", (e) => {
      const rect = wrap.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / rect.width - 0.5;
      const ny = (e.clientY - rect.top) / rect.height - 0.5;
      targetX = nx * 18;
      targetY = -ny * 14;
    });

    wrap.addEventListener("pointerleave", () => {
      targetX = 0;
      targetY = 0;
    });

    raf = requestAnimationFrame(tick);
  </script>
</body>
</html>
