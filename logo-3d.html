<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALTER EGO — 3D logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ece7df;
      --ink: #161616;
      --mute: #5c584f;
      --panel: rgba(255, 255, 255, 0.55);
      --line: rgba(22, 22, 22, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 55% at 15% 10%, #fff8ef 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 90% 85%, #d9e4ef 0%, transparent 50%),
        linear-gradient(160deg, #efeae2, #e4ddd2 55%, #d7e0e8);
    }

    .stage {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 40px 20px 64px;
    }

    .frame {
      width: min(880px, 100%);
      display: grid;
      gap: 22px;
      justify-items: center;
      text-align: center;
    }

    h1 {
      font-family: Syne, sans-serif;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 0.06em;
      font-weight: 800;
    }

    .sub {
      max-width: 40ch;
      color: var(--mute);
      font-size: 15px;
      line-height: 1.45;
      margin-top: -6px;
    }

    .logo-wrap {
      width: min(520px, 88vw);
      aspect-ratio: 1;
      position: relative;
      animation: float 6s ease-in-out infinite;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
      filter: drop-shadow(0 18px 28px rgba(20, 16, 10, 0.18));
    }

    .logo-wrap:hover img {
      transform: rotateX(7deg) rotateY(-9deg) scale(1.02);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      appearance: none;
      text-decoration: none;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 16px;
      font: 500 14px/1 "IBM Plex Sans", system-ui, sans-serif;
      backdrop-filter: blur(10px);
      transition: transform 160ms ease, background 160ms ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-1px);
    }

    .compare {
      width: min(620px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .compare figure {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255,255,255,0.45);
      text-align: left;
    }

    .compare img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      display: block;
      background:
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
      background-color: #f3f3f3;
    }

    .compare figcaption {
      padding: 10px 12px 12px;
      font-size: 12px;
      color: var(--mute);
    }

    @media (max-width: 640px) {
      .compare { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="frame">
      <h1>ALTER EGO</h1>
      <p class="sub">Объёмное стекло в стиле референса: толстый refractive rim, блики, сине-янтарная заливка. PNG с прозрачным фоном.</p>

      <div class="logo-wrap" id="logoTilt">
        <img
          src="assets/alter-ego-logo-3d.png"
          alt="ALTER EGO — 3D logo on transparent background"
          width="1024"
          height="1024"
        />
      </div>

      <div class="actions">
        <a class="btn" href="assets/alter-ego-logo-3d.png" download>Цветной PNG</a>
        <a class="btn" href="assets/alter-ego-logo-3d-bw.png" download>Ч/Б PNG</a>
        <a class="btn" href="assets/alter-ego-logo-original.jpg" download>Оригинал</a>
      </div>

      <div class="compare">
        <figure>
          <img src="assets/alter-ego-logo-3d.png" alt="Цветная 3D glass версия" />
          <figcaption>Цвет</figcaption>
        </figure>
        <figure>
          <img src="assets/alter-ego-logo-3d-bw.png" alt="Чёрно-белая 3D glass версия" />
          <figcaption>Ч/Б</figcaption>
        </figure>
      </div>
    </div>
  </main>

  <script>
    const wrap = document.getElementById("logoTilt");
    const img = wrap.querySelector("img");
    let targetX = 0, targetY = 0, curX = 0, curY = 0;

    function tick() {
      curX += (targetX - curX) * 0.14;
      curY += (targetY - curY) * 0.14;
      img.style.transform = `rotateX(${curY}deg) rotateY(${curX}deg)`;
      requestAnimationFrame(tick);
    }

    wrap.addEventListener("pointermove", (e) => {
      const r = wrap.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width - 0.5;
      const ny = (e.clientY - r.top) / r.height - 0.5;
      targetX = nx * 16;
      targetY = -ny * 12;
    });

    wrap.addEventListener("pointerleave", () => {
      targetX = 0;
      targetY = 0;
    });

    requestAnimationFrame(tick);
  </script>
</body>
</html>
