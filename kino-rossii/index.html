<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Кино России — 18 слайдов</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;500;600&display=swap" rel="stylesheet"/>
<style>
  :root { --bg:#070707; --ink:#f4f1ea; --muted:rgba(244,241,234,.62); --line:rgba(244,241,234,.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:"Manrope",sans-serif;
    background:
      radial-gradient(900px 500px at 20% -10%, rgba(106,154,168,.18), transparent 60%),
      radial-gradient(700px 400px at 90% 10%, rgba(196,122,58,.14), transparent 55%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:48px 28px 80px;
  }
  .wrap { max-width:1180px; margin:0 auto; }
  h1 {
    font-family:"Bebas Neue",sans-serif;
    font-size:clamp(48px,8vw,84px);
    letter-spacing:.06em;
    line-height:.95;
  }
  .lead {
    margin-top:18px;
    max-width:640px;
    color:var(--muted);
    font-size:17px;
    line-height:1.55;
    font-weight:300;
  }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin:28px 0 42px; }
  a.btn {
    display:inline-flex; align-items:center; justify-content:center;
    padding:12px 18px; border:1px solid var(--line);
    color:var(--ink); text-decoration:none; letter-spacing:.14em;
    text-transform:uppercase; font-size:12px; background:rgba(255,255,255,.03);
  }
  a.btn:hover { background:rgba(255,255,255,.08); }
  .grid {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
  }
  @media (max-width:860px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
  .card {
    border:1px solid var(--line);
    background:#0b0b0b;
    overflow:hidden;
  }
  .card img { width:100%; aspect-ratio:1080/1350; object-fit:cover; display:block; background:#111; }
  .card .meta {
    display:flex; justify-content:space-between; gap:10px;
    padding:12px 14px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }
  .card a { color:var(--ink); text-decoration:none; }
  .card a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Кино России</h1>
    <p class="lead">18 отдельных слайдов о создании и развитии российского кино — от первых сеансов 1896 года до наших дней. Файлы в папке <code>slides/</code> можно сразу сохранить.</p>
    <div class="actions">
      <a class="btn" href="slides/kino-rossii-18-slides.zip" download>Скачать все JPG (ZIP)</a>
      <a class="btn" href="slides/slide_01.jpg" download>Скачать 01</a>
      <a class="btn" href="slide.html?n=1">Листать в браузере</a>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    const titles = [
      "Титул","Визуалы","Привет","Первые огни","История","Монтаж",
      "Эксперимент","Авангард","Мастера","Послание","Раскадровка","Хроника",
      "Локация","Оттепель","Эпоха","Звук","Сегодня","Спасибо"
    ];
    const grid = document.getElementById("grid");
    for (let i = 1; i <= 18; i++) {
      const n = String(i).padStart(2,"0");
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <a href="slides/slide_${n}.jpg" download>
          <img src="slides/slide_${n}.jpg" alt="Слайд ${n}"/>
        </a>
        <div class="meta">
          <span>${n} · ${titles[i-1]}</span>
          <a href="slides/slide_${n}.jpg" download>JPG</a>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
