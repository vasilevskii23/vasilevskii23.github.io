<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Стикер — МЫ В КРУЖИМ</title>
<style>
  @font-face {
    font-family: "InterLocal";
    src: url("file:///usr/share/fonts/truetype/macos/Inter-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "InterLocal";
    src: url("file:///usr/share/fonts/truetype/macos/Inter-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: "InterLocal";
    src: url("file:///usr/share/fonts/truetype/macos/Inter-Bold.ttf") format("truetype");
    font-weight: 800;
    font-style: normal;
  }

  :root {
    --ink: #1a1a1a;
    --paper: #ffffff;
    --stage: #e8eaed;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--stage);
    font-family: "InterLocal", "Inter", "YS Text", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 48px 24px;
  }

  .label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7280;
  }

  /* Print-ready circular sticker */
  .sticker {
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 12px 36px rgba(0, 0, 0, 0.12),
      0 28px 64px rgba(0, 0, 0, 0.08);
    position: relative;
    overflow: hidden;
  }

  .sticker::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
    pointer-events: none;
  }

  .logo-wrap {
    width: 268px;
    height: 268px;
    margin-top: -28px;
    margin-bottom: 36px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .copy {
    text-align: center;
    color: var(--ink);
    line-height: 1;
  }

  .line-we {
    display: block;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.12em;
    margin-bottom: 14px;
  }

  .line-brand {
    display: block;
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  /* Door glass preview */
  .door {
    width: 420px;
    height: 640px;
    border-radius: 18px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 42%),
      linear-gradient(180deg, #9eb4c8 0%, #7a93a8 48%, #6a8499 100%);
    box-shadow:
      inset 0 0 0 10px #dfe3e8,
      inset 0 0 0 14px #b8c0c8,
      0 24px 48px rgba(0, 0, 0, 0.18);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .door::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 8px;
    background:
      linear-gradient(115deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0.08) 100%);
    pointer-events: none;
  }

  .door .mini {
    width: 210px;
    height: 210px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    position: relative;
    z-index: 1;
  }

  .door .mini .logo-wrap {
    width: 78px;
    height: 78px;
    margin-top: -6px;
    margin-bottom: 10px;
  }

  .door .mini .line-we {
    font-size: 11px;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .door .mini .line-brand {
    font-size: 18px;
  }

  @media print {
    body { background: white; padding: 0; gap: 0; }
    .label, .door { display: none !important; }
    .sticker {
      box-shadow: none;
      width: 180mm;
      height: 180mm;
    }
  }
</style>
</head>
<body>
  <p class="label">Макет стикера на дверь · Ø печать</p>

  <div class="sticker" id="sticker">
    <div class="logo-wrap">
      <img src="logo.jpg" alt="Логотип Кружим" width="268" height="268"/>
    </div>
    <div class="copy">
      <span class="line-we">МЫ В</span>
      <span class="line-brand">КРУЖИМ</span>
    </div>
  </div>

  <p class="label">Превью на стекле двери</p>
  <div class="door" id="door">
    <div class="mini">
      <div class="logo-wrap">
        <img src="logo.jpg" alt="" width="78" height="78"/>
      </div>
      <div class="copy">
        <span class="line-we">МЫ В</span>
        <span class="line-brand">КРУЖИМ</span>
      </div>
    </div>
  </div>
</body>
</html>
