<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Стикер — МЫ В КРУЖИМ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bd: #1A3A8F;
    --bm: #2968D4;
    --bl: #3D8EF0;
    --or: #F4621F;
    --ro: #E0341A;
    --ink: #0D1F5C;
    --bg: #F0F5FF;
    --sf: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    font-family: "Golos Text", system-ui, sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 48px 24px;
  }

  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bm);
  }

  .sticker {
    width: min(72vw, 720px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--sf);
    box-shadow:
      0 1px 2px rgba(13, 31, 92, 0.06),
      0 14px 40px rgba(26, 58, 143, 0.16);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 12% 10% 8%;
    overflow: hidden;
  }

  .sticker::after {
    content: "";
    position: absolute;
    inset: 1.1%;
    border-radius: 50%;
    border: 3px solid var(--bm);
    pointer-events: none;
  }

  .logo {
    width: 22%;
    aspect-ratio: 1;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    margin-bottom: 4%;
  }

  .line-we {
    font-family: "Golos Text", sans-serif;
    font-weight: 500;
    font-size: clamp(14px, 4.2vw, 30px);
    color: var(--ink);
    letter-spacing: 0.14em;
    margin-bottom: 0.35em;
  }

  .line-brand {
    font-family: "Unbounded", sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 7.5vw, 56px);
    color: var(--or);
    letter-spacing: 0.02em;
    line-height: 1;
    margin-bottom: 5%;
  }

  .qr-wrap {
    width: 26%;
    aspect-ratio: 1;
    background: var(--or);
    border-radius: 14%;
    padding: 5%;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .qr-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #fff;
    border-radius: 6%;
    image-rendering: pixelated;
  }

  .url {
    margin-top: 3%;
    font-family: "Golos Text", sans-serif;
    font-weight: 500;
    font-size: clamp(11px, 2.6vw, 20px);
    color: var(--bd);
    letter-spacing: 0.04em;
  }

  .door {
    width: min(70vw, 380px);
    aspect-ratio: 9 / 14;
    border-radius: 18px;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 42%),
      linear-gradient(180deg, #9eb4c8 0%, #7a93a8 48%, #6a8499 100%);
    box-shadow:
      inset 0 0 0 10px #dfe3e8,
      inset 0 0 0 14px #b8c0c8,
      0 24px 48px rgba(13, 31, 92, 0.18);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }

  .door .mini {
    width: 58%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(13, 31, 92, 0.22);
  }

  .door .mini img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
  <p class="label">Макет стикера · фирменные цвета КРУЖИМ</p>

  <div class="sticker" id="sticker">
    <img class="logo" src="logo.jpg" alt="Логотип Кружим"/>
    <div class="line-we">МЫ В</div>
    <div class="line-brand">КРУЖИМ</div>
    <div class="qr-wrap">
      <img src="qr.png" alt="QR-код"/>
    </div>
    <div class="url">kruzhim.ru</div>
  </div>

  <p class="label">Превью на стекле двери</p>
  <div class="door">
    <div class="mini">
      <img src="sticker_transparent.png" alt="Стикер на двери"/>
    </div>
  </div>
</body>
</html>
