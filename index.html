<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бутерброд — постер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; background: #111; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 0.5rem;
    }
    img {
      display: block;
      width: min(100%, 900px);
      height: auto;
      max-height: 98svh;
      object-fit: contain;
      border-radius: 0.4rem;
    }
  </style>
</head>
<body>
  <img src="images/buterbrod/poster.jpg" alt="Постер-коллаж: бутерброд, два фото и рецепт" />
</body>
</html>
