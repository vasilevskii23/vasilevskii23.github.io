<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Бутерброд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #141810;
      --cream: #f6f1e4;
      --leaf: #1f5a32;
      --tomato: #c53224;
      --butter: #e8c56a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0f120e;
      color: var(--ink);
      font-family: "Manrope", sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(0.75rem, 2vw, 1.5rem);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(197, 50, 36, 0.28), transparent 50%),
        radial-gradient(ellipse 70% 50% at 90% 80%, rgba(31, 90, 50, 0.35), transparent 55%),
        linear-gradient(145deg, #1a2018, #0c0f0b 55%, #16140f);
    }

    .poster {
      width: min(980px, 100%);
      aspect-ratio: 4 / 5;
      max-height: min(94svh, 1100px);
      position: relative;
      overflow: hidden;
      border-radius: 1.1rem;
      background:
        linear-gradient(160deg, #efe8d6 0%, #e4ddd0 48%, #d7e0d4 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 30px 80px rgba(0, 0, 0, 0.55);
      animation: posterIn 800ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(20, 24, 16, 0.05) 0.7px, transparent 0.7px);
      background-size: 4px 4px;
      opacity: 0.45;
      pointer-events: none;
      z-index: 1;
    }

    .shot {
      position: absolute;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(20, 24, 16, 0.28);
      background: #222;
    }

    .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .shot-result {
      inset: 4% 4% 28% 28%;
      border-radius: 0.85rem;
      z-index: 2;
      transform: rotate(1.4deg);
      animation: floatA 10s ease-in-out infinite alternate;
    }

    .shot-result img { object-position: center 40%; }

    .shot-prep {
      width: 42%;
      aspect-ratio: 3 / 4;
      left: 5%;
      bottom: 7%;
      border-radius: 0.75rem;
      z-index: 4;
      transform: rotate(-6deg);
      border: 4px solid #fff8ea;
      animation: floatB 11s ease-in-out infinite alternate;
    }

    .shot-prep img { object-position: center 45%; }

    .brand-block {
      position: absolute;
      top: 5%;
      left: 5%;
      z-index: 5;
      max-width: 46%;
      animation: rise 700ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-family: "Unbounded", sans-serif;
      font-weight: 800;
      font-size: clamp(2.1rem, 7.2vw, 4.4rem);
      line-height: 0.9;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .tagline {
      margin-top: 0.55rem;
      font-size: clamp(0.78rem, 1.5vw, 0.95rem);
      font-weight: 600;
      color: rgba(20, 24, 16, 0.72);
      max-width: 16rem;
      line-height: 1.35;
    }

    .recipe {
      position: absolute;
      right: 4%;
      bottom: 5%;
      z-index: 5;
      width: min(46%, 280px);
      padding: 1rem 1rem 0.95rem;
      background: rgba(20, 24, 16, 0.9);
      color: #f4efe4;
      border-radius: 0.9rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      animation: rise 750ms 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .recipe-label {
      font-family: "Unbounded", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--butter);
      margin-bottom: 0.55rem;
    }

    .recipe h2 {
      font-family: "Unbounded", sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      line-height: 1.15;
    }

    .recipe ul {
      list-style: none;
      display: grid;
      gap: 0.42rem;
    }

    .recipe li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      align-items: baseline;
      font-size: clamp(0.78rem, 1.4vw, 0.9rem);
      font-weight: 600;
      border-bottom: 1px dotted rgba(244, 239, 228, 0.22);
      padding-bottom: 0.35rem;
    }

    .recipe li:last-child { border-bottom: 0; padding-bottom: 0; }

    .recipe li span:last-child {
      color: #9fd4a8;
      font-family: "Unbounded", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .accent {
      position: absolute;
      width: 7.5rem;
      height: 7.5rem;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e85a45, var(--tomato) 60%, #8f1f14);
      right: 8%;
      top: 7%;
      z-index: 3;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: "Unbounded", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.2;
      transform: rotate(8deg);
      box-shadow: 0 12px 28px rgba(197, 50, 36, 0.4);
      animation: pop 900ms 300ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes posterIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pop {
      from { opacity: 0; transform: rotate(8deg) scale(0.7); }
      to { opacity: 1; transform: rotate(8deg) scale(1); }
    }
    @keyframes floatA {
      from { transform: rotate(1.4deg) translateY(0); }
      to { transform: rotate(2deg) translateY(-6px); }
    }
    @keyframes floatB {
      from { transform: rotate(-6deg) translateY(0); }
      to { transform: rotate(-4.5deg) translateY(5px); }
    }

    @media (max-width: 720px) {
      body { padding: 0.55rem; align-items: start; }
      .poster {
        aspect-ratio: auto;
        min-height: min(94svh, 920px);
        max-height: none;
        width: 100%;
      }
      .brand-block { max-width: 58%; top: 4%; left: 4%; }
      .brand { font-size: clamp(2rem, 11vw, 3.1rem); }
      .accent {
        width: 5.4rem;
        height: 5.4rem;
        font-size: 0.6rem;
        right: 4%;
        top: 4.5%;
      }
      .shot-result {
        inset: 18% 5% 36% 5%;
        transform: rotate(0.6deg);
      }
      .shot-prep {
        width: 46%;
        left: 5%;
        bottom: 22%;
      }
      .recipe {
        width: auto;
        left: 4%;
        right: 4%;
        bottom: 3.5%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .poster, .brand-block, .recipe, .accent, .shot-result, .shot-prep {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <article class="poster" aria-label="Постер-коллаж рецепта бутерброда">
    <div class="brand-block">
      <p class="brand">Бутерброд</p>
      <p class="tagline">Открытый. На тыквенном хлебе. Пять продуктов.</p>
    </div>

    <div class="accent" aria-hidden="true">5 мин<br />1 порция</div>

    <figure class="shot shot-result">
      <img src="images/buterbrod/result.jpg" alt="Готовый бутерброд на тарелке" />
    </figure>

    <figure class="shot shot-prep">
      <img src="images/buterbrod/ingredients.jpg" alt="Ингредиенты на столе" />
    </figure>

    <aside class="recipe">
      <p class="recipe-label">Рецепт</p>
      <h2>Ингредиенты</h2>
      <ul>
        <li><span>Докторская колбаса</span><span>1 ломтик</span></li>
        <li><span>Тыквенный хлеб</span><span>1 ломтик</span></li>
        <li><span>Сливочное масло</span><span>10–15 г</span></li>
        <li><span>Огурец</span><span>3 ломтика</span></li>
        <li><span>Помидор</span><span>2 ломтика</span></li>
      </ul>
    </aside>
  </article>
</body>
</html>
