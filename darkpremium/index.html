<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>/darkpremium — раскадровка</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --void: #0B0A09;
  --charcoal: #1C1B19;
  --kraft: #B8956C;
  --paper: #D4BC9A;
  --rim: #F4F1EC;
  --muted: #8A8178;
  --line: rgba(244,241,236,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--void);
  color: var(--rim);
  font-family: Manrope, sans-serif;
}
main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 64px; }
header { margin-bottom: 28px; }
.brand {
  font-family: Syne, sans-serif;
  font-weight: 800;
  font-size: clamp(28px, 6vw, 44px);
  letter-spacing: -0.03em;
}
.brand em { font-style: normal; color: var(--kraft); }
.sub { margin-top: 8px; color: var(--muted); font-size: 14px; max-width: 36rem; }

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 900px) { .board { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .board { grid-template-columns: 1fr; } }

figure {
  background: var(--charcoal);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
figure a { display: block; color: inherit; text-decoration: none; }
figure img {
  display: block;
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
}
figcaption {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px 12px;
  font-size: 12px;
}
figcaption strong {
  font-family: Syne, sans-serif;
  font-weight: 600;
  letter-spacing: 0.04em;
}
figcaption span { color: var(--muted); }

.sheet {
  margin-top: 28px;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.sheet img { display: block; width: 100%; height: auto; }
.note { margin-top: 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">/<em>darkpremium</em></div>
    <p class="sub">Раскадровка — 8 отдельных кадров в тёмном премиум-стиле по кадру с крафт-стаканом.</p>
  </header>

  <div class="board">
    <figure>
      <a href="frames/01.jpg"><img src="frames/01.jpg" alt="Кадр 01"/><figcaption><strong>01</strong><span>Establishing</span></figcaption></a>
    </figure>
    <figure>
      <a href="frames/02.jpg"><img src="frames/02.jpg" alt="Кадр 02"/><figcaption><strong>02</strong><span>Enter</span></figcaption></a>
    </figure>
    <figure>
      <a href="frames/03.jpg"><img src="frames/03.jpg" alt="Кадр 03"/><figcaption><strong>03</strong><span>Hero</span></figcaption></a>
    </figure>
    <figure>
      <a href="frames/04.jpg"><img src="frames/04.jpg" alt="Кадр 04"/><figcaption><strong>04</strong><span>Angle</span></figcaption></a>
    </figure>
    <figure>
      <a href="frames/05.jpg"><img src="frames/05.jpg" alt="Кадр 05"/><figcaption><strong>05</strong><span>Detail</span></figcaption></a>
    </figure>
    <figure>
      <a href="frames/06.jpg"><img src="frames/06.jpg" alt="Кадр 06"/><figcaption><strong>06</strong><span>Overhead</span></figcaption></a>
    </figure>
    <figure>
      <a href="frames/07.jpg"><img src="frames/07.jpg" alt="Кадр 07"/><figcaption><strong>07</strong><span>Bokeh</span></figcaption></a>
    </figure>
    <figure>
      <a href="frames/08.jpg"><img src="frames/08.jpg" alt="Кадр 08"/><figcaption><strong>08</strong><span>Wide</span></figcaption></a>
    </figure>
  </div>

  <div class="sheet">
    <img src="storyboard-sheet.jpg" alt="Контакт-лист раскадровки"/>
  </div>
  <p class="note">Отдельные файлы: <code>darkpremium/frames/01.jpg</code> … <code>08.jpg</code></p>
</main>
</body>
</html>
