<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>/Aestheticluxury — Insta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --sand: #E6DFD2;
  --stone: #D9D0C0;
  --ink: #1A1714;
  --muted: #7A7268;
  --brass: #9C8558;
  --foam: #F7F3EC;
  --line: rgba(26, 23, 20, 0.10);
  --void: #12100E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(156, 133, 88, 0.18), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(255, 255, 255, 0.35), transparent 50%),
    linear-gradient(180deg, var(--sand) 0%, var(--stone) 100%);
  color: var(--ink);
  font-family: Figtree, sans-serif;
}
main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 72px; }
header { margin-bottom: 28px; }
.brand {
  font-family: Syne, sans-serif;
  font-weight: 800;
  font-size: clamp(28px, 6vw, 46px);
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.brand em { font-style: normal; color: var(--brass); }
.sub { margin-top: 10px; color: var(--muted); font-size: 14px; max-width: 38rem; line-height: 1.5; }

.section-label {
  margin: 28px 0 12px;
  font-family: Syne, sans-serif;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--brass);
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
@media (max-width: 900px) { .board { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .board { grid-template-columns: 1fr; } }

figure {
  background: var(--foam);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(26, 23, 20, 0.06);
}
figure a { display: block; color: inherit; text-decoration: none; }
figure img {
  display: block;
  width: 100%;
  aspect-ratio: 4/5;
  object-fit: cover;
  background: var(--void);
}
figcaption {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px 12px;
  font-size: 12px;
}
figcaption strong {
  font-family: Syne, sans-serif;
  font-weight: 700;
  letter-spacing: 0.04em;
}
figcaption span { color: var(--muted); }

.carousel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
@media (max-width: 700px) { .carousel { grid-template-columns: 1fr; } }

.sheet {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--void);
}
.sheet img { display: block; width: 100%; height: auto; }
.note { margin-top: 10px; color: var(--muted); font-size: 12px; }

.grade-row {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 12px;
}
@media (max-width: 700px) { .grade-row { grid-template-columns: 1fr; } }
.grade-row figure img { aspect-ratio: 4/3; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">/Aesthetic<em>luxury</em></div>
    <p class="sub">Instagram pack из пляжного гриля: quiet-luxury раскадровка (6 кадров 4:5) + готовая карусель из исходника.</p>
  </header>

  <div class="section-label">Storyboard · 01–06</div>
  <div class="board">
    <figure>
      <a href="frames/01.jpg" target="_blank" rel="noopener"><img src="frames/01.jpg" alt="01 Establishing"/></a>
      <figcaption><strong>01</strong><span>Establishing</span></figcaption>
    </figure>
    <figure>
      <a href="frames/02.jpg" target="_blank" rel="noopener"><img src="frames/02.jpg" alt="02 Hero"/></a>
      <figcaption><strong>02</strong><span>Hero</span></figcaption>
    </figure>
    <figure>
      <a href="frames/03.jpg" target="_blank" rel="noopener"><img src="frames/03.jpg" alt="03 Craft"/></a>
      <figcaption><strong>03</strong><span>Craft</span></figcaption>
    </figure>
    <figure>
      <a href="frames/04.jpg" target="_blank" rel="noopener"><img src="frames/04.jpg" alt="04 Embers"/></a>
      <figcaption><strong>04</strong><span>Embers</span></figcaption>
    </figure>
    <figure>
      <a href="frames/05.jpg" target="_blank" rel="noopener"><img src="frames/05.jpg" alt="05 Overhead"/></a>
      <figcaption><strong>05</strong><span>Overhead</span></figcaption>
    </figure>
    <figure>
      <a href="frames/06.jpg" target="_blank" rel="noopener"><img src="frames/06.jpg" alt="06 Wide"/></a>
      <figcaption><strong>06</strong><span>Wide</span></figcaption>
    </figure>
  </div>

  <div class="section-label">Carousel · из исходного фото</div>
  <div class="carousel">
    <figure>
      <a href="carousel/01.jpg" target="_blank" rel="noopener"><img src="carousel/01.jpg" alt="Carousel 01"/></a>
      <figcaption><strong>01 — 03</strong><span>Scene</span></figcaption>
    </figure>
    <figure>
      <a href="carousel/02.jpg" target="_blank" rel="noopener"><img src="carousel/02.jpg" alt="Carousel 02"/></a>
      <figcaption><strong>02 — 03</strong><span>Fish</span></figcaption>
    </figure>
    <figure>
      <a href="carousel/03.jpg" target="_blank" rel="noopener"><img src="carousel/03.jpg" alt="Carousel 03"/></a>
      <figcaption><strong>03 — 03</strong><span>Detail</span></figcaption>
    </figure>
  </div>

  <div class="section-label">Grade · исходник</div>
  <div class="grade-row">
    <figure>
      <a href="grade.jpg" target="_blank" rel="noopener"><img src="grade.jpg" alt="Aesthetic luxury grade"/></a>
      <figcaption><strong>Grade</strong><span>Warm muted film</span></figcaption>
    </figure>
    <figure>
      <a href="source-preview.jpg" target="_blank" rel="noopener"><img src="source-preview.jpg" alt="Source preview"/></a>
      <figcaption><strong>Source</strong><span>Original</span></figcaption>
    </figure>
  </div>

  <div class="section-label">Contact sheet</div>
  <div class="sheet">
    <img src="storyboard-sheet.jpg" alt="Storyboard contact sheet"/>
  </div>
  <p class="note">Формат кадров: 1080×1350 (4:5) — готово к загрузке в Instagram. Карусель: 01 → 02 → 03.</p>
</main>
</body>
</html>
