<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LUNARIS — карточка маркетплейса</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #050505;
    --ink: #f4f2ec;
    --muted: #9a968c;
    --strike: #6a675f;
    --accent: #d62828;
    --cta: #f4f2ec;
    --cta-ink: #111;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #050505;
    padding: 0;
  }

  .card {
    width: 900px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 48%, rgba(120, 118, 110, 0.22) 0%, transparent 62%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(40, 38, 34, 0.55) 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Manrope", sans-serif;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1.2px 1.2px at 88% 28%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 18% 72%, rgba(255,255,255,0.18), transparent),
      radial-gradient(1px 1px at 64% 80%, rgba(255,255,255,0.15), transparent);
    opacity: 0.55;
    pointer-events: none;
  }

  .top {
    position: relative;
    z-index: 2;
    padding: 56px 48px 0;
    text-align: center;
  }

  .brand {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 700;
    font-size: 92px;
    letter-spacing: 0.18em;
    line-height: 0.95;
    text-indent: 0.18em;
    color: var(--ink);
    animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .headline {
    margin-top: 18px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink);
    animation: rise 900ms 120ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .support {
    margin-top: 12px;
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
    animation: rise 900ms 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .hero {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    width: 780px;
    height: 780px;
    border-radius: 50%;
    overflow: hidden;
    background: #000;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 120px rgba(0,0,0,0.65),
      0 0 90px rgba(180, 175, 160, 0.12);
    animation: float-in 1100ms 180ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transform: scale(1.04);
  }

  .bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding: 0 48px 48px;
    animation: rise 900ms 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .price-block {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .badge {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.02em;
    box-shadow: 0 10px 28px rgba(214, 40, 40, 0.35);
  }

  .prices {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .price-now {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .price-old {
    font-size: 22px;
    font-weight: 600;
    color: var(--strike);
    text-decoration: line-through;
  }

  .cta {
    min-width: 220px;
    height: 72px;
    border: none;
    border-radius: 999px;
    background: var(--cta);
    color: var(--cta-ink);
    font-family: inherit;
    font-size: 24px;
    font-weight: 700;
    padding: 0 36px;
    cursor: pointer;
    transition: transform 180ms ease, background 180ms ease;
  }

  .cta:hover { transform: translateY(-2px); }
  .cta:active { transform: translateY(0); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float-in {
    from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  @media (max-width: 960px) {
    body { padding: 0; align-items: start; }
    .card {
      width: min(100vw, 900px);
      height: auto;
      aspect-ratio: 3 / 4;
    }
    .top { padding: 6.2% 5.3% 0; }
    .brand { font-size: clamp(40px, 10.2vw, 92px); }
    .headline { font-size: clamp(16px, 3.3vw, 30px); margin-top: 2%; }
    .support { font-size: clamp(12px, 2vw, 18px); }
    .hero {
      width: 86.6%;
      height: auto;
      aspect-ratio: 1;
      top: 53%;
    }
    .bottom { padding: 0 5.3% 5.3%; gap: 12px; }
    .badge { width: clamp(52px, 9.3vw, 84px); height: clamp(52px, 9.3vw, 84px); font-size: clamp(16px, 2.9vw, 26px); }
    .price-now { font-size: clamp(28px, 5.8vw, 52px); }
    .price-old { font-size: clamp(14px, 2.4vw, 22px); }
    .cta { min-width: 0; height: clamp(48px, 8vw, 72px); font-size: clamp(14px, 2.7vw, 24px); padding: 0 clamp(18px, 4vw, 36px); }
  }
</style>
</head>
<body>
  <article class="card" aria-label="Рекламная карточка LUNARIS">
    <header class="top">
      <h1 class="brand">LUNARIS</h1>
      <p class="headline">3D ночник с рельефом Луны</p>
      <p class="support">Реалистичные кратеры · мягкий свет · декор комнаты</p>
    </header>

    <div class="hero">
      <img src="product.jpg" alt="3D ночник LUNARIS с рельефом лунной поверхности"/>
    </div>

    <footer class="bottom">
      <div class="price-block">
        <div class="badge" aria-label="Скидка 33 процента">−33%</div>
        <div class="prices">
          <div class="price-now">2 990 ₽</div>
          <div class="price-old">4 490 ₽</div>
        </div>
      </div>
      <button class="cta" type="button">В корзину</button>
    </footer>
  </article>
</body>
</html>
